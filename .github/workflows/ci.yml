name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Core tests
        run: cargo test --lib
  app-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build the app
        run: ./scripts/build-swift.sh
