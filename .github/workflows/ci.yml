name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Core tests
        run: cargo test --lib
      - name: Every Vietnamese text in the window has an English entry
        run: python3 scripts/check-swift-strings.py
  app-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build the app
        run: ./scripts/build-swift.sh
